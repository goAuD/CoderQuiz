name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check JS files
        run: |
          node --check app.js
          node --check i18n.js
          node --check questions.js

      - name: Quiz behavior and bilingual question validation
        run: node --test tests/*.test.cjs
