name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check JS files
        run: |
          node --check app.js
          node --check i18n.js
          node --check questions.js
          node --check catalog.js
          node --check scripts/build-static.cjs

      - name: Quiz behavior and bilingual question validation
        run: node --test tests/*.test.cjs

      - name: Test release promotion in temporary directories
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build the static release
        run: |
          node scripts/build-static.cjs
          tar -czf coderquiz-dist.tar.gz -C dist .
          sha256sum coderquiz-dist.tar.gz > coderquiz-dist.tar.gz.sha256

      - name: Upload the verified site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coderquiz-dist-${{ github.sha }}
          path: |
            coderquiz-dist.tar.gz
            coderquiz-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
