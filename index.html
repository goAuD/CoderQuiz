<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoderQuiz – DSGVO LAP Applikationsentwicklung</title>
  <meta name="description" content="Lernquiz zur Vorbereitung auf die LAP Applikationsentwicklung-Coding: DSGVO, Urheberrecht, IT-Sicherheit, Österreich/EU-Recht." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>

  <header>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="hu">HU</button>
    </div>
    <div class="brand">
      <a id="logo-link" class="logo-link" href="#" aria-label="CoderQuiz – Startseite">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <defs>
            <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5b6af0"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="9" fill="url(#logo-g)"/>
          <rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="20" y="27"
            font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
            font-size="16" font-weight="800" fill="white"
            text-anchor="middle" letter-spacing="-0.5">CQ</text>
        </svg>
      </a>
      <h1>CoderQuiz – <span id="module-title">DSGVO &amp; Recht</span></h1>
    </div>
    <p class="subtitle" id="quiz-subtitle"></p>
  </header>

  <!-- ── Setup-Screen ────────────────────────────────────────────── -->
  <main id="setup-screen" class="card hidden">
    <h2 id="setup-heading"></h2>
    <p id="setup-sub" class="setup-sub"></p>
    <div id="module-meta" class="module-meta"></div>
    <div id="topic-chips" class="topic-chips"></div>
    <button id="start-btn"></button>
  </main>

  <!-- ── Quiz-Screen ─────────────────────────────────────────────── -->
  <main id="quiz-screen" class="card hidden">

    <div class="progress-wrap">
      <div class="progress-track">
        <div id="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="meta-row">
      <span id="progress-text"></span>
      <span id="score-display"></span>
    </div>

    <span class="topic-badge" id="topic-badge"></span>

    <p id="question-text"></p>

    <div id="answers-list" role="list"></div>

    <div id="explanation-box" class="hidden">
      <span id="explanation-text"></span>
    </div>

    <button id="next-btn" class="hidden"></button>

  </main>

  <!-- ── Ergebnis-Screen ─────────────────────────────────────────── -->
  <main id="result-screen" class="card hidden">

    <div class="result-header">
      <h2 id="result-heading"></h2>

      <svg class="score-ring" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="54" />
        <circle id="score-circle" cx="60" cy="60" r="54"
                stroke-dasharray="339.3" stroke-dashoffset="339.3" />
        <text class="ring-text" x="60" y="57" text-anchor="middle" dominant-baseline="middle" id="ring-pct">0 %</text>
        <text class="ring-sub"  x="60" y="72" text-anchor="middle" id="ring-sub-text"></text>
      </svg>

      <p class="score-numbers">
        <strong id="final-score"></strong> <span id="score-suffix"></span>
      </p>
      <span id="grade-text" class="grade pass"></span>
    </div>

    <div class="wrong-section">
      <h3 id="wrong-heading"></h3>
      <div id="wrong-list"></div>
    </div>

    <button id="restart-btn"></button>

  </main>

  <footer>
    Quellen: DSGVO (Verordnung (EU) 2016/679) · DSG 2018 · UrhG · ECG · OWASP ·
    <a href="https://www.dsb.gv.at" target="_blank" rel="noopener">dsb.gv.at</a> ·
    Apache-2.0 License
  </footer>

  <script src="i18n.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>

</body>
</html>
